{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block body %}
<div class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4 py-4">
            <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
                <span class="logo">E</span>
                <span class="fs-2 fw-semibold">Eutava</span>
            </div>

            <form method="post" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <h2 class="h3 fw-medium mb-1 text-center">Welcome Back</h2>
                <p class="text-body-secondary mb-4 text-center">Sign in to see where you stand.</p>

                {% include "components/flash.html" %}

                <div class="vstack gap-3">
                    <div class="">
                        <input class="form-control form-control-lg" type="email" name="email" placeholder="Email" value="{{ request.form.get('email', '') }}" autocomplete="email" required>
                    </div>
                    <div class="">
                        <input class="form-control form-control-lg" type="password" name="password" placeholder="Password" value autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-primary btn-lg" type="submit">Sign In</button>
                    <p class="text-center text-body-secondary mb-0 mt-2">
                        New Here?
                        <a href="{{ url_for('register') }}">Create an account</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
