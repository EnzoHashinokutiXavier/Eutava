{% extends "base.html" %}

{% block body %}

    {# Exibe mensagem para cada mensagem flash #}
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <p>{{msg}}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <h1>login</h1>
    <form method="POST">
        <p>Name:</p>
        <p><input type="text" name="name"/></p>
        <p><input type="submit" value="enviar"/></p>
    </form>

{% endblock %}
