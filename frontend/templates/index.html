<!-- Pagina principal -->
{% extends "base.html" %}

{% block body %}

    {# Exibe mensagem para cada mensagem flash #}
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <p>{{msg}}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <h1>home</h1>
    <p>Olá, {{ user }}!</p>

{% endblock %}
